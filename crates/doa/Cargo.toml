[package]
name = "doa"
authors = ["Daniel A Gutierrez"]
version = "0.0.1"
edition = "2024"
description = "Dense ordered arenas. Under construction."
license = "Apache-2.0"
repository = "https://github.com/Daniel-A-Gutierrez/TinyTrie"
homepage = "https://github.com/Daniel-A-Gutierrez/TinyTrie"
readme = "README.md"
[dependencies]
itertools = "0.15.0"
arrays = {path="../arrays"}

[dev-dependencies]
sorted-vec = "0.8.11"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "sorted_find_slot"
harness = false

[[bench]]
name = "sorted_insert"
harness = false

[[bench]]
name = "blockmap_insert"
harness = false

[[bench]]
name = "bimap"
harness = false

[[bench]]
name = "strings"
harness = false

[[bench]]
name = "skipset"
harness = false

[[bench]]
name = "cursor"
harness = false

